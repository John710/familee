# Familee - running it on a server with a ready-made image from the registry.
#
# The same services as docker-compose.build.yml, except that the app is pulled as
# ghcr.io/john710/familee:${FAMILEE_VERSION} instead of being built from the sources.
# Keep the two files in step.
#
# Two ways to reach the application, chosen in .env:
#
#   1. By IP address and port (default). The app is published on FAMILEE_PORT of
#      the host, plain HTTP. Works with no reverse proxy at all.
#
#   2. Behind Traefik over HTTPS. Set FAMILEE_HOST to your domain and switch the
#      compose file set in .env (see the COMPOSE_FILE comment there). The
#      traefik overlay adds the labels and joins the proxy network, and removes
#      the published port, so the app is reachable only through Traefik.
#
# Postgres and Redis are NOT created here. They must already be running, and the
# application reaches them by container name through the DATA_NETWORK.
#
#   docker compose pull
#   docker compose up -d    # the container applies the migrations itself
#
# .env selects this file: COMPOSE_FILE=docker-compose.image.yml

name: familee

services:
    app:
        # A fixed name: `docker logs familee`, the health checks and the tools below find it.
        container_name: familee

        # An exact release, never `latest`: set FAMILEE_VERSION in .env (the default is the release
        # this file was published with). To move to another version, change it and run
        # `docker compose pull && docker compose up -d`.
        image: ghcr.io/john710/familee:${FAMILEE_VERSION:-0.6.0}

        # The application may not gain rights it did not start with.
        security_opt:
            - no-new-privileges:true

        restart: unless-stopped

        # Every setting the application reads, spelled out one by one; the values come from .env
        # (see .env.example). Adding a variable means adding a line here as well - that is the point
        # of the list: what the container gets is visible in one place.
        environment:
            TZ: ${APP_TIME_ZONE:-Asia/Vladivostok}
            # Postgres and Redis, already running (see the header).
            DATABASE_URL: ${DATABASE_URL}
            DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
            REDIS_URL: ${REDIS_URL}
            # Sign-in: the address the browser uses and the secret that signs the sessions.
            BETTER_AUTH_URL: ${BETTER_AUTH_URL}
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
            # The time zone of the dates shown, and the proxies in front of the archive.
            APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Vladivostok}
            TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
            # The photographs inside the container (the media volume below), their size limit, and
            # the switch that skips the migrations for a second instance.
            MEDIA_ROOT: ${MEDIA_ROOT:-/data/media}
            MEDIA_MAX_UPLOAD_MB: ${MEDIA_MAX_UPLOAD_MB:-25}
            SKIP_MIGRATIONS: ${SKIP_MIGRATIONS:-0}
            # The map's tile server and the credit in its corner (OpenStreetMap when unset).
            MAP_TILE_URL: ${MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
            MAP_ATTRIBUTION: ${MAP_ATTRIBUTION:-© OpenStreetMap contributors}

        ports:
            # Mode 1: the address of the server and this port. Mode 2 removes it
            # in docker-compose.traefik.yml.
            - "${FAMILEE_PORT:-3000}:3000"

        volumes:
            # The original photographs and the previews generated ahead of time: the only data of
            # the application outside Postgres. The volume keeps its name across `down` and `up`, so
            # it can be found for a backup (see the README) and survives an upgrade.
            - media:/data/media

        networks:
            # default: an ordinary network of this project. Docker publishes ports only
            # for containers that have at least one non-internal network, and the data
            # network may be declared internal (as it is on the server).
            - default
            - data

        healthcheck:
            # Readiness, not liveness: the probe asks Postgres and Redis as well, so a container
            # whose database is gone shows as unhealthy instead of pretending to work. The image
            # applies the migrations before the server starts, which is why the start period is
            # generous.
            test:
                - CMD
                - node
                - -e
                - "fetch('http://127.0.0.1:3000/api/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 60s

        logging:
            driver: json-file
            options:
                max-size: 10m
                max-file: "3"

    # A one-shot run of the SQL by hand: the demo seed (`seed`) and the smoke
    # tests (`test`). The application image applies the migrations itself on
    # start; this service is only psql, so nothing is installed on the host.
    tools:
        image: postgres:alpine
        profiles:
            - tools
        environment:
            DATABASE_URL: ${DATABASE_URL}
        volumes:
            - ./db:/db:ro
        entrypoint:
            - bash
            - /db/tools.sh
        networks:
            - data
        restart: "no"

networks:
    # The network postgres and redis run in.
    data:
        external: true
        name: ${DATA_NETWORK:-postgres}

volumes:
    # The photographs of every tree. Pinned to one name, so a second installation of the same
    # project on the host cannot quietly take over the photographs of the first one.
    media:
        name: familee_media

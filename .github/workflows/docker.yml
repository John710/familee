# Publishes the Docker image to the GitHub Container Registry.
#
# A version tag (vX.Y.Z) builds and pushes ghcr.io/<owner>/familee with the tags X.Y.Z, X.Y and
# latest. The tag must match the version in package.json, so an image never carries a wrong number.
# The workflow can be started by hand for an existing tag: gh workflow run docker.yml --ref vX.Y.Z.
# Nothing runs on ordinary pushes, which keeps the free Actions minutes for releases.
#
# Third-party actions are pinned to a full commit SHA; the version is kept in the comment next to it.

name: docker

on:
    push:
        tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: docker-${{ github.ref }}
    cancel-in-progress: false

jobs:
    image:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: The tag matches package.json
              run: |
                  version="$(node -p "require('./package.json').version")"
                  if [ "$GITHUB_REF_NAME" != "v$version" ]; then
                      echo "The ref $GITHUB_REF_NAME does not match package.json version $version."
                      exit 1
                  fi

            # Registry paths must be lowercase; the owner's login may contain capitals.
            - name: Image name
              run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Tags and labels
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ env.IMAGE }}
                  flavor: |
                      latest=false
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=raw,value=latest

            - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

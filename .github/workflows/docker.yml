# Publishes the Docker image to the GitHub Container Registry.
#
# A version tag (vX.Y.Z) builds and pushes ghcr.io/<owner>/familee with the tags X.Y.Z, X.Y and
# latest. The workflow can also be started by hand for a tag that already exists. The image is
# built from the same Dockerfile the server uses, so what is published is what runs at home.

name: docker

on:
    push:
        tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: docker-${{ github.ref }}
    cancel-in-progress: false

jobs:
    image:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Registry paths must be lowercase; the owner's login may contain capitals.
            - name: Image name
              run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Tags
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

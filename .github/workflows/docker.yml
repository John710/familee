# Publishes the Docker image to the GitHub Container Registry.
#
# A version tag (vX.Y.Z) builds and pushes ghcr.io/<owner>/familee with the tags X.Y.Z, X.Y and
# latest. The tag must match the version in package.json, so an image never carries a wrong number.
# A version tag may also be started by hand: gh workflow run docker.yml --ref vX.Y.Z.
#
# Every push to main and every pull request runs the same test job - types, linter, messages, the
# migrations, the demo seed and the smoke tests - without publishing anything, so a break is seen
# before a tag is made rather than on it. Only a version tag builds an image.
#
# The image is published only once the "test" job is green: the checks (npm test) and the database
# (the migrations, the demo seed and the smoke tests) run first, so a broken tag never reaches the
# registry. The image is built for linux/amd64 and linux/arm64, each on a runner of its own
# architecture (`ubuntu-24.04-arm` for arm64, free for a public repository): emulating arm64 on amd64
# cost eleven minutes a build and once hung for 59 minutes until the job was killed at its own
# limit. Each build pushes by digest and the merge job joins the two digests into one manifest list.
#
# Once the image is out, two more jobs run on the tag: Trivy scans the published image and reports
# what it finds without failing the run, and the GitHub release "Familee X.Y.Z" is created with
# the notes of scripts/release-notes.mjs, so a release no longer waits for a hand-made one.
#
# Third-party actions are pinned to a full commit SHA; the version is kept in the comment next to it.

name: docker

on:
    push:
        branches: [main]
        tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: docker-${{ github.ref }}
    cancel-in-progress: false

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        container: node:26-alpine
        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_USER: familee
                    POSTGRES_PASSWORD: familee
                    POSTGRES_DB: familee
                options: >-
                    --health-cmd "pg_isready -U familee"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 30
        steps:
            # The Node image carries no git (checkout needs it) and no psql (the seed and the smoke
            # tests are written for psql). libc6-compat is what sharp wants on musl.
            - name: The tools the later steps need
              run: apk add --no-cache bash git libc6-compat postgresql-client

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: The dependencies
              run: npm ci

            - name: Types, linter and messages
              run: npm test

            - name: Migrations, the demo seed and the smoke tests
              env:
                  DATABASE_URL: postgres://familee:familee@postgres:5432/familee
              run: |
                  node db/migrate.mjs
                  bash db/tools.sh seed test

    # One build per architecture, each on a runner of that architecture. The digest of a build is
    # handed to the merge job through an artifact: a manifest list cannot be made from a tag that
    # does not exist yet.
    image:
        needs: test
        # Only a version tag builds: a push to main or a pull request stops after the tests.
        if: startsWith(github.ref, 'refs/tags/v')
        permissions:
            contents: read
            packages: write
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      runner: ubuntu-latest
                      name: amd64
                    - platform: linux/arm64
                      runner: ubuntu-24.04-arm
                      name: arm64
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: The tag matches package.json
              run: |
                  version="$(node -p "require('./package.json').version")"
                  if [ "$GITHUB_REF_NAME" != "v$version" ]; then
                      echo "The ref $GITHUB_REF_NAME does not match package.json version $version."
                      exit 1
                  fi

            # Registry paths must be lowercase; the owner's login may contain capitals.
            - name: Image name
              run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Tags and labels
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ env.IMAGE }}
                  flavor: |
                      latest=false
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=raw,value=latest

            # A layer cache of its own per architecture, so the two builds do not chase each other
            # out of the same cache scope.
            - name: Build by digest
              id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.name }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.name }}
                  outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

            - name: Keep the digest
              run: |
                  mkdir -p /tmp/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "/tmp/digests/${digest#sha256:}"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: digests-${{ matrix.name }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    # The two digests become one manifest list under the tags a reader pulls: X.Y.Z, X.Y and latest.
    merge:
        needs: image
        if: startsWith(github.ref, 'refs/tags/v')
        permissions:
            contents: read
            packages: write
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  path: /tmp/digests
                  pattern: digests-*
                  merge-multiple: true

            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Image name
              run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

            - name: Tags
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ env.IMAGE }}
                  flavor: |
                      latest=false
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=raw,value=latest

            - name: The manifest list
              working-directory: /tmp/digests
              run: |
                  mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
                  args=()
                  for tag in "${tags[@]}"; do args+=(-t "$tag"); done
                  for digest in *; do args+=("${{ env.IMAGE }}@sha256:${digest}"); done
                  docker buildx imagetools create "${args[@]}"

            - name: What was published
              run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

    # The published image is scanned for known vulnerabilities. The scan only reports: a finding in
    # a base layer is fixed by the next release, not by refusing the one that is already out.
    scan:
        needs: merge
        if: startsWith(github.ref, 'refs/tags/v')
        permissions:
            contents: read
            packages: read
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Image name
              run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

            - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  image-ref: ${{ env.IMAGE }}
                  format: table
                  exit-code: 0
                  severity: HIGH,CRITICAL
                  ignore-unfixed: true
              env:
                  TRIVY_USERNAME: ${{ github.actor }}
                  TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

    # The GitHub release of the tag, titled "Familee X.Y.Z", with the notes of
    # scripts/release-notes.mjs: the commits since the previous tag, grouped by their type. It runs
    # once the image is out, so a release never points at an image that failed to publish.
    release:
        needs: merge
        if: startsWith(github.ref, 'refs/tags/v')
        permissions:
            contents: write
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: The notes and the release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="$GITHUB_REF_NAME"
                  previous="$(git tag -l 'v*' --sort=-v:refname | awk -v t="$tag" 'found { print; exit } $0 == t { found = 1 }')"
                  if [ -z "$previous" ]; then previous="$(git rev-list --max-parents=0 HEAD | tail -1)"; fi
                  node scripts/release-notes.mjs "$previous" "$tag" > notes.md
                  if gh release view "$tag" > /dev/null 2>&1; then
                      gh release edit "$tag" --title "Familee ${tag#v}" --notes-file notes.md
                  else
                      gh release create "$tag" --title "Familee ${tag#v}" --notes-file notes.md --verify-tag
                  fi
